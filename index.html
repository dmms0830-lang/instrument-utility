<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/pic/favicon.png" />
  <link rel="apple-touch-icon" href="/pic/favicon.png" />
  <meta name="theme-color" content="#f3f6fa" />
  <!-- 저장된 테마를 페인트 전에 적용 — 새로고침 시 색 깜빡임 방지 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('iu-theme');
        t = (t === 'dark' || t === 'light') ? t : 'light';
        var r = document.documentElement;
        if (t === 'dark') r.classList.add('dark');
        r.style.colorScheme = t;
        r.style.backgroundColor = t === 'dark' ? '#020617' : '#f3f6fa';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#020617' : '#f3f6fa');
      } catch (e) { }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Cache Control - Always fetch latest -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="/manifest.json" />
  <title>Industrial Instrumentation Utility</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
